syntax = "proto3";

package blocker;

option go_package = "github.com/everestp/blocker;proto";

message Block {
  Header header = 1;
  repeated Transaction transactions = 2;
}

message Header {
  int32 version = 1;
  int64 height = 2;
  bytes prev_hash = 3;
  bytes root_hash = 4; // Merkle root of transactions
  int64 timestamp = 5;
}

message TxInput {
	//this  previous hash of the transaction containign the output we want to sepnd
	bytes prevTxHash = 1;
	//This index of the output of the previous transacton we want to spen
	uint32 prevOutIndex = 2;
	bytes publicKey =3;
	bytes signature = 4;
}

message TxOutput {
	int64 amount = 1;
	bytes address = 2;
}

message Transaction {
  int32 version = 1;
  repeated TxInput inputes = 2;
  repeated TxOutput outputs = 3;
}
